name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 12:00 UTC (evita la pausa de 7 días de Supabase)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite disparo manual desde el tab Actions de GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'Production' || 'Preview' }}
    steps:
      - name: Send keep-alive HTTP Ping to Supabase Table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🔍 Diagnosticando lectura de Secrets en Environment dinámico..."
          echo "Rama actual: ${{ github.ref_name }}"
          echo "Longitud de SUPABASE_URL: ${#SUPABASE_URL}"
          echo "Longitud de SUPABASE_ANON_KEY: ${#SUPABASE_ANON_KEY}"

          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ Error: El Secret SUPABASE_URL no fue detectado en el Environment seleccionado."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ Error: El Secret SUPABASE_ANON_KEY no fue detectado en el Environment seleccionado."
            exit 1
          fi

          TARGET_URL="${SUPABASE_URL%/}/rest/v1/contact_messages?select=id&limit=1"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$TARGET_URL")

          echo "Supabase Response Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "⚡ Supabase está activo y respondiendo correctamente (HTTP $HTTP_STATUS)."
          else
            echo "⚠️ Advertencia: Supabase respondió con código HTTP $HTTP_STATUS"
            exit 1
          fi