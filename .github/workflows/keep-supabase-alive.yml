name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 12:00 UTC (evita la pausa de 7 días de Supabase)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite disparo manual desde el tab Actions de GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP Ping to Supabase Table
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/contact_messages?select=id&limit=1")
          
          echo "Supabase Response Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "⚡ Supabase está activo y respondiendo correctamente (HTTP $HTTP_STATUS)."
          else
            echo "⚠️ Advertencia: Supabase respondió con código HTTP $HTTP_STATUS"
            exit 1
          fi
