steps:
  - name: Send keep-alive HTTP Ping to Supabase Table
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    run: |
      echo "🔍 Diagnosticando lectura de Secrets..."
      echo "Longitud de SUPABASE_URL: ${#SUPABASE_URL}"
      echo "Longitud de SUPABASE_ANON_KEY: ${#SUPABASE_ANON_KEY}"

      if [ -z "$SUPABASE_URL" ]; then
        echo "❌ Error: El Secret SUPABASE_URL no fue detectado."
        exit 1
      fi

      TARGET_URL="${SUPABASE_URL%/}/rest/v1/contact_messages?select=id&limit=1"

      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "apikey: $SUPABASE_ANON_KEY" \
        -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
        "$TARGET_URL")

      echo "Supabase Response Status Code: $HTTP_STATUS"

      if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
        echo "⚡ Supabase está activo y respondiendo correctamente (HTTP $HTTP_STATUS)."
      else
        echo "⚠️ Advertencia: Supabase respondió con código HTTP $HTTP_STATUS"
        exit 1
      fi